#! mongodb-deployment.yaml
# Generated code, do not edit
apiVersion: apps/v1
kind: Deployment
metadata:
    name: mongodb
    namespace: awdf
    labels:
        com.docker.compose.project: awdf
        com.docker.compose.service: mongodb
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: awdf
            com.docker.compose.service: mongodb
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: awdf
                com.docker.compose.service: mongodb
                com.docker.compose.network.app-network: "true"
        spec:
            restartPolicy: unless-stopped
            containers:
                - name: awdf-mongodb
                  image: mongo:7.0
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: MONGO_INITDB_DATABASE
                      value: "awdf_db"
                  livenessProbe:
                    exec:
                        command: [mongosh --eval db.adminCommand('ping')]
                    periodSeconds: 10
                    initialDelaySeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
                  ports:
                    - name: mongodb-27017
                      containerPort: 27017
                  volumeMounts:
                    - name: data-db
                      mountPath: /data/db
            volumes:
                - name: data-db
                  persistentVolumeClaim:
                    claimName: mongodb-mongodb-data
