<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211E"/>
      <stop offset="50%" stop-color="#1A1817"/>
      <stop offset="100%" stop-color="#10100F"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E9A23B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E9A23B"/>
    </linearGradient>
  </defs>

  <!-- Base Badge with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Top Accent Highlight -->
  <path d="M 18 2 L 46 2" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monogram 'VG' -->
  <text x="32" y="43" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-1.5" fill="url(#textGrad)">VG</text>

  <!-- Active Tech Spark Dot -->
  <circle cx="50" cy="18" r="3" fill="#55B685"/>
</svg>
